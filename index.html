<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>遺跡クイズ</title>

  <style>
    :root {
      --bg: #111;
      --text: #fff;
      --overlay: rgba(0, 0, 0, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .page {
      width: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
    }

    .quiz-wrap {
      width: min(100%, 1100px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #quizImage {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100svh - 24px);
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      touch-action: manipulation;
      cursor: pointer;
    }

    #answerOverlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      background: var(--overlay);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 260ms ease,
        visibility 0s linear 260ms;
    }

    #answerOverlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition:
        opacity 260ms ease,
        visibility 0s linear 0s;
    }

    .answer-panel {
      width: min(94vw, 900px);
      max-height: 94svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;

      transform: scale(0.12);
      opacity: 0;
      transition:
        transform 520ms cubic-bezier(.18,.89,.32,1.28),
        opacity 300ms ease;
    }

    #answerOverlay.show .answer-panel {
      transform: scale(1);
      opacity: 1;
    }

    #answerCanvas {
      display: block;
      max-width: 100%;
      max-height: 82svh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 12px 44px rgba(0, 0, 0, .5);
      -webkit-touch-callout: default;
      user-select: auto;
      -webkit-user-select: auto;
    }

    .save-note {
      margin: 0;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .58);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    #maskCanvas {
      display: none;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="quiz-wrap">
      <img
        id="quizImage"
        src="image_quiz.jpg"
        alt="クイズ画像"
        draggable="false"
      >
    </div>
  </main>

  <div id="answerOverlay" aria-hidden="true">
    <div class="answer-panel">
      <canvas
        id="answerCanvas"
        class="answer-canvas"
        aria-label="正解画像"
      ></canvas>
      <p class="save-note">正解！ この画像を長押しして保存してください。</p>
    </div>
  </div>

  <canvas id="maskCanvas"></canvas>

  <script>
    (() => {
      const quizImage = document.getElementById("quizImage");
      const answerOverlay = document.getElementById("answerOverlay");
      const answerCanvas = document.getElementById("answerCanvas");
      const maskCanvas = document.getElementById("maskCanvas");
      const ctx = maskCanvas.getContext("2d", { willReadFrequently: true });

      const maskImage = new Image();
      maskImage.src = "image_area.jpg";

      let maskReady = false;
      let alreadyCorrect = false;

      maskImage.onload = () => {
        maskCanvas.width = maskImage.naturalWidth;
        maskCanvas.height = maskImage.naturalHeight;
        ctx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
        ctx.drawImage(maskImage, 0, 0);
        maskReady = true;
      };

      maskImage.onerror = () => {
        console.error("image_area.jpg を読み込めませんでした。");
      };

      quizImage.addEventListener("click", (event) => {
        if (!maskReady || alreadyCorrect) return;

        const rect = quizImage.getBoundingClientRect();
        const displayX = event.clientX - rect.left;
        const displayY = event.clientY - rect.top;

        const naturalRatio = quizImage.naturalWidth / quizImage.naturalHeight;
        const displayRatio = rect.width / rect.height;

        let renderedWidth;
        let renderedHeight;
        let offsetX = 0;
        let offsetY = 0;

        if (displayRatio > naturalRatio) {
          renderedHeight = rect.height;
          renderedWidth = renderedHeight * naturalRatio;
          offsetX = (rect.width - renderedWidth) / 2;
        } else {
          renderedWidth = rect.width;
          renderedHeight = renderedWidth / naturalRatio;
          offsetY = (rect.height - renderedHeight) / 2;
        }

        const xInImage = displayX - offsetX;
        const yInImage = displayY - offsetY;

        if (
          xInImage < 0 ||
          yInImage < 0 ||
          xInImage >= renderedWidth ||
          yInImage >= renderedHeight
        ) {
          return;
        }

        const maskX = Math.min(
          maskCanvas.width - 1,
          Math.max(0, Math.floor((xInImage / renderedWidth) * maskCanvas.width))
        );

        const maskY = Math.min(
          maskCanvas.height - 1,
          Math.max(0, Math.floor((yInImage / renderedHeight) * maskCanvas.height))
        );

        const pixel = ctx.getImageData(maskX, maskY, 1, 1).data;
        const [r, g, b, a] = pixel;

        /*
          image_area.jpg は
          白(RGB 255,255,255) = 正解
          黒(RGB 0,0,0) = 無反応
          を想定。

          JPG圧縮誤差を吸収するため、完全一致ではなく
          「十分に白い」かどうかで判定する。
        */
        const isCorrect =
          a > 0 &&
          r >= 128 &&
          g >= 128 &&
          b >= 128;

        if (isCorrect) {
          showAnswer();
        }
      });


      function formatCorrectDateTime(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        const hour = String(date.getHours()).padStart(2, "0");
        const minute = String(date.getMinutes()).padStart(2, "0");
        const second = String(date.getSeconds()).padStart(2, "0");

        return `${year}/${month}/${day} ${hour}:${minute}:${second}`;
      }


      function createRandomSerial() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        const bytes = new Uint32Array(12);

        if (window.crypto && window.crypto.getRandomValues) {
          window.crypto.getRandomValues(bytes);
        } else {
          for (let i = 0; i < bytes.length; i++) {
            bytes[i] = Math.floor(Math.random() * 0xffffffff);
          }
        }

        let serial = "";

        for (let i = 0; i < bytes.length; i++) {
          serial += chars[bytes[i] % chars.length];

          if (i === 3 || i === 7) {
            serial += "-";
          }
        }

        return serial;
      }


      function drawAnswerImageWithSecurityInfo() {
        return new Promise((resolve, reject) => {
          const img = new Image();

          img.onload = () => {
            const canvas = answerCanvas;
            const drawCtx = canvas.getContext("2d");

            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;

            drawCtx.clearRect(0, 0, canvas.width, canvas.height);
            drawCtx.drawImage(img, 0, 0);

            const now = new Date();

            const dateText =
              "正解日時: " + formatCorrectDateTime(now);

            const serialText =
              "SERIAL: " + createRandomSerial();

            const noteText =
              "不正コピー防止のため識別情報を表示しています";

            /*
              右上端へ小さく焼き込む。
              画像サイズに応じて自動調整。
            */
            const mainFont =
              Math.max(11, Math.round(canvas.width * 0.0080));

            const noteFont =
              Math.max(9, Math.round(canvas.width * 0.0065));

            const padX =
              Math.max(6, Math.round(canvas.width * 0.006));

            const padY =
              Math.max(4, Math.round(canvas.height * 0.004));

            const lineGap =
              Math.round(mainFont * 1.15);

            drawCtx.textAlign = "right";
            drawCtx.textBaseline = "top";

            drawCtx.font = `700 ${mainFont}px sans-serif`;

            const widths = [
              drawCtx.measureText(dateText).width,
              drawCtx.measureText(serialText).width
            ];

            drawCtx.font = `500 ${noteFont}px sans-serif`;
            widths.push(drawCtx.measureText(noteText).width);

            const boxWidth =
              Math.max(...widths) + padX * 2;

            const boxHeight =
              lineGap * 2 + noteFont * 1.35 + padY * 2;

            drawCtx.fillStyle = "rgba(0, 0, 0, 0.44)";
            drawCtx.fillRect(
              canvas.width - boxWidth,
              0,
              boxWidth,
              boxHeight
            );

            drawCtx.fillStyle = "#ffffff";
            drawCtx.shadowColor = "rgba(0,0,0,0.9)";
            drawCtx.shadowBlur =
              Math.max(1, Math.round(mainFont * 0.08));

            const x = canvas.width - padX;
            const y = padY;

            drawCtx.font = `700 ${mainFont}px sans-serif`;
            drawCtx.fillText(dateText, x, y);
            drawCtx.fillText(serialText, x, y + lineGap);

            drawCtx.font = `500 ${noteFont}px sans-serif`;
            drawCtx.fillText(
              noteText,
              x,
              y + lineGap * 2
            );

            drawCtx.shadowBlur = 0;

            resolve();
          };

          img.onerror = () => {
            reject(
              new Error("image_answer.jpg を読み込めませんでした。")
            );
          };

          img.src = "image_answer.jpg";
        });
      }


      async function showAnswer() {
        alreadyCorrect = true;

        try {
          await drawAnswerImageWithSecurityInfo();

          answerOverlay.classList.add("show");
          answerOverlay.setAttribute("aria-hidden", "false");

        } catch (error) {
          console.error(error);
          alreadyCorrect = false;
          alert("正解画像を表示できませんでした。image_answer.jpg を確認してください。");
        }
      }

      function resetQuiz() {
        answerOverlay.classList.remove("show");
        answerOverlay.setAttribute("aria-hidden", "true");

        // 閉じるアニメーション完了後に再回答可能にする
        window.setTimeout(() => {
          alreadyCorrect = false;
        }, 520);
      }

      answerCanvas.addEventListener("click", resetQuiz);
    })();
  </script>
</body>
</html>
