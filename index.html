<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>遺跡クイズ</title>

  <style>
    :root {
      --bg: #111;
      --text: #fff;
      --overlay: rgba(0, 0, 0, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .page {
      width: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
    }

    .quiz-wrap {
      width: min(100%, 1100px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #quizImage {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100svh - 24px);
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      touch-action: manipulation;
      cursor: pointer;
    }

    #answerOverlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      background: var(--overlay);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 260ms ease,
        visibility 0s linear 260ms;
    }

    #answerOverlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition:
        opacity 260ms ease,
        visibility 0s linear 0s;
    }

    .answer-panel {
      width: min(94vw, 900px);
      max-height: 94svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;

      transform: scale(0.12);
      opacity: 0;
      transition:
        transform 520ms cubic-bezier(.18,.89,.32,1.28),
        opacity 300ms ease;
    }

    #answerOverlay.show .answer-panel {
      transform: scale(1);
      opacity: 1;
    }

    #answerImage {
      display: block;
      max-width: 100%;
      max-height: 82svh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 12px 44px rgba(0, 0, 0, .5);
      -webkit-touch-callout: default;
      user-select: auto;
      -webkit-user-select: auto;
    }

    .save-note {
      margin: 0;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .58);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    #maskCanvas {
      display: none;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="quiz-wrap">
      <img
        id="quizImage"
        src="image_quiz.jpg"
        alt="クイズ画像"
        draggable="false"
      >
    </div>
  </main>

  <div id="answerOverlay" aria-hidden="true">
    <div class="answer-panel">
      <img
        id="answerImage"
        src="image_answer.jpg"
        alt="正解画像"
      >
      <p class="save-note">正解！ この画像を長押しして保存してください。</p>
    </div>
  </div>

  <canvas id="maskCanvas"></canvas>

  <script>
    (() => {
      const quizImage = document.getElementById("quizImage");
      const answerOverlay = document.getElementById("answerOverlay");
      const maskCanvas = document.getElementById("maskCanvas");
      const ctx = maskCanvas.getContext("2d", { willReadFrequently: true });

      const maskImage = new Image();
      maskImage.src = "image_area.jpg";

      let maskReady = false;
      let alreadyCorrect = false;

      maskImage.onload = () => {
        maskCanvas.width = maskImage.naturalWidth;
        maskCanvas.height = maskImage.naturalHeight;
        ctx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
        ctx.drawImage(maskImage, 0, 0);
        maskReady = true;
      };

      maskImage.onerror = () => {
        console.error("image_area.jpg を読み込めませんでした。");
      };

      quizImage.addEventListener("click", (event) => {
        if (!maskReady || alreadyCorrect) return;

        const rect = quizImage.getBoundingClientRect();
        const displayX = event.clientX - rect.left;
        const displayY = event.clientY - rect.top;

        const naturalRatio = quizImage.naturalWidth / quizImage.naturalHeight;
        const displayRatio = rect.width / rect.height;

        let renderedWidth;
        let renderedHeight;
        let offsetX = 0;
        let offsetY = 0;

        if (displayRatio > naturalRatio) {
          renderedHeight = rect.height;
          renderedWidth = renderedHeight * naturalRatio;
          offsetX = (rect.width - renderedWidth) / 2;
        } else {
          renderedWidth = rect.width;
          renderedHeight = renderedWidth / naturalRatio;
          offsetY = (rect.height - renderedHeight) / 2;
        }

        const xInImage = displayX - offsetX;
        const yInImage = displayY - offsetY;

        if (
          xInImage < 0 ||
          yInImage < 0 ||
          xInImage >= renderedWidth ||
          yInImage >= renderedHeight
        ) {
          return;
        }

        const maskX = Math.min(
          maskCanvas.width - 1,
          Math.max(0, Math.floor((xInImage / renderedWidth) * maskCanvas.width))
        );

        const maskY = Math.min(
          maskCanvas.height - 1,
          Math.max(0, Math.floor((yInImage / renderedHeight) * maskCanvas.height))
        );

        const pixel = ctx.getImageData(maskX, maskY, 1, 1).data;
        const [r, g, b, a] = pixel;

        /*
          image_area.jpg は
          白(RGB 255,255,255) = 正解
          黒(RGB 0,0,0) = 無反応
          を想定。

          JPG圧縮誤差を吸収するため、完全一致ではなく
          「十分に白い」かどうかで判定する。
        */
        const isCorrect =
          a > 0 &&
          r >= 128 &&
          g >= 128 &&
          b >= 128;

        if (isCorrect) {
          showAnswer();
        }
      });

      function showAnswer() {
        alreadyCorrect = true;
        answerOverlay.classList.add("show");
        answerOverlay.setAttribute("aria-hidden", "false");
      }

      function resetQuiz() {
        answerOverlay.classList.remove("show");
        answerOverlay.setAttribute("aria-hidden", "true");

        // 閉じるアニメーション完了後に再回答可能にする
        window.setTimeout(() => {
          alreadyCorrect = false;
        }, 520);
      }

      document.getElementById("answerImage").addEventListener("click", resetQuiz);
    })();
  </script>
</body>
</html>
